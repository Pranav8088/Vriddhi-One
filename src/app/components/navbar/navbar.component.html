<header class="nav" [class.nav--solid]="scrolled()" [class.nav--open]="open()">
  <div class="nav__inner shell-wide">
    <a class="nav__brand" routerLink="/" aria-label="VriddhiOne AI Systems — home">
      <app-logo />
    </a>

    <!-- Desktop links -->
    <nav class="nav__links hide-md" aria-label="Primary">
      @for (item of nav; track item.path) {
        <a
          class="nav__link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="nav__actions">
      <a class="btn btn--primary btn--sm hide-sm" routerLink="/contact">
        Start a conversation
        <app-icon class="btn__icon" name="arrow-right" size="1rem" />
      </a>

      <button
        class="nav__burger show-md"
        type="button"
        (click)="toggle()"
        [attr.aria-expanded]="open()"
        aria-controls="nav-drawer"
        [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
      >
        <app-icon [name]="open() ? 'close' : 'menu'" size="1.35rem" />
      </button>
    </div>
  </div>

  <!-- Read progress -->
  <div class="nav__progress" aria-hidden="true">
    <span class="nav__progress-bar" [style.--progress]="progress()"></span>
  </div>
</header>

<!-- Mobile drawer -->
<div
  id="nav-drawer"
  class="drawer"
  [class.drawer--open]="open()"
  [attr.aria-hidden]="!open()"
>
  <div class="drawer__panel">
    <nav class="drawer__links" aria-label="Primary">
      @for (item of nav; track item.path; let i = $index) {
        <a
          class="drawer__link"
          [style.--i]="i"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          (click)="close()"
        >
          <span class="drawer__link-no">0{{ i + 1 }}</span>
          {{ item.label }}
          <app-icon name="arrow-up-right" size="1.1rem" />
        </a>
      }
      <a
        class="drawer__link"
        [style.--i]="nav.length"
        routerLink="/contact"
        routerLinkActive="is-active"
        (click)="close()"
      >
        <span class="drawer__link-no">0{{ nav.length + 1 }}</span>
        Contact
        <app-icon name="arrow-up-right" size="1.1rem" />
      </a>
    </nav>

    <div class="drawer__foot">
      <a class="btn btn--primary btn--block" routerLink="/contact" (click)="close()">
        Start a conversation
        <app-icon class="btn__icon" name="arrow-right" size="1rem" />
      </a>

      <div class="drawer__social">
        @for (s of socials; track s.href) {
          <a
            class="social"
            [href]="s.href"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="s.label"
          >
            <app-icon [path]="s.icon" mode="fill" size="0.95rem" />
          </a>
        }
        <a class="social" [href]="mailto" aria-label="Email us">
          <app-icon name="mail" size="0.95rem" />
        </a>
      </div>
    </div>
  </div>
</div>
