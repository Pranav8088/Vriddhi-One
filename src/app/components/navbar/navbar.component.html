<header class="site-nav" [class.site-nav--scrolled]="scrolled()">
  <div class="shell-container site-nav__inner">
    <a class="site-nav__brand" routerLink="/" appRipple>
      <span class="site-nav__brand-mark">
        <span class="material-symbols-outlined">dataset</span>
      </span>
      <span class="site-nav__brand-copy">
        <strong>Vriddhi One</strong>
        <small>Software, AI, and web products</small>
      </span>
    </a>

    <nav class="site-nav__links">
      @for (link of navLinks; track link.href) {
        <a
          class="site-nav__link"
          [routerLink]="link.href"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          routerLinkActive="site-nav__link--active"
          (click)="closeMenu()">
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="site-nav__actions">
      <div class="site-nav__status">
        <span class="site-nav__status-dot"></span>
        <span>Available for new work</span>
      </div>

      <a
        class="page-button page-button--primary site-nav__cta"
        routerLink="/contact"
        appRipple
        appInteractiveSurface
        [interactionStrength]="6">
        Start a project
      </a>

      <button
        type="button"
        class="site-nav__menu"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation"
        appRipple>
        <span class="material-symbols-outlined">
          {{ menuOpen() ? 'close' : 'menu' }}
        </span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="shell-container site-nav__mobile">
      @for (link of navLinks; track link.href) {
        <a
          class="site-nav__mobile-link"
          [routerLink]="link.href"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          routerLinkActive="site-nav__mobile-link--active"
          (click)="closeMenu()"
          appRipple>
          {{ link.label }}
        </a>
      }
      <a class="page-button page-button--secondary" routerLink="/contact" (click)="closeMenu()" appRipple>
        Start a project
      </a>
    </div>
  }

  <div class="scroll-progress" aria-hidden="true">
    <div class="scroll-progress__bar" [style.width.%]="scrollProgress()"></div>
  </div>
</header>
