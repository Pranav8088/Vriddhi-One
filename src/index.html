    <!-- Paints the dark background before the bundle lands, so there is no
         white flash on first load. -->
    <style>
      html {
        background: #070810;
      }
      body {
        margin: 0;
        background: #070810;
        color: #f4f5f8;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #070810;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #boot[hidden] {
        display: none;
      }
      #boot span {
        width: 2rem;
        height: 2rem;
        border: 2px solid rgba(227, 179, 65, 0.25);
        border-top-color: #e3b341;
        border-radius: 999px;
        animation: bootspin 0.7s linear infinite;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot span {
          animation: none;
        }
      }
    </style>
