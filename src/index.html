    <style>
      :root {
        --boot-bg: #fbfaf8;
        --boot-fg: rgba(26, 29, 36, 0.2);
        --boot-spin: #8a6410;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --boot-bg: #0a0c11;
          --boot-fg: rgba(238, 240, 243, 0.18);
          --boot-spin: #e9bd54;
        }
      }
      :root[data-theme='dark'] {
        --boot-bg: #0a0c11;
        --boot-fg: rgba(238, 240, 243, 0.18);
        --boot-spin: #e9bd54;
      }
      html {
        background: var(--boot-bg);
      }
      body {
        margin: 0;
        background: var(--boot-bg);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #boot[hidden] {
        display: none;
      }
      #boot span {
        width: 1.75rem;
        height: 1.75rem;
        border: 2px solid var(--boot-fg);
        border-top-color: var(--boot-spin);
        border-radius: 999px;
        animation: bootspin 0.7s linear infinite;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot span {
          animation: none;
        }
      }
    </style>
