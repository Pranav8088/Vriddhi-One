[build]
  command = "npm run build -- --configuration production"
  publish = "dist/vriddhi-one/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Redirects. Order matters: the API route has to be matched before the
# single-page-app fallback swallows everything.
# ---------------------------------------------------------------------------

# Keeps the frontend's /api/contact path identical on Netlify and Vercel.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# SPA fallback — the Angular router handles the path client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # 'unsafe-inline' on style-src is required: Angular injects component
    # styles and style bindings inline. Fonts come from Google's CDN.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Hashed build output never changes under the same name.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be revalidated, or users get a stale shell that
# references deleted bundles.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# theme-init.js is not content-hashed, so it must revalidate. Declared after
# the generic *.js rule so this Cache-Control takes precedence.
[[headers]]
  for = "/theme-init.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
